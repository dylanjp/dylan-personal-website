<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#neonGlow)">
    <!-- shackle -->
    <path
      d="M 42 58 V 42 a 22 22 0 0 1 44 0 v 16"
      fill="none"
      stroke="#00ffff"
      stroke-width="9"
      stroke-linecap="round"
    />
    <!-- lock body -->
    <rect
      x="28"
      y="58"
      width="72"
      height="54"
      rx="10"
      fill="rgba(0, 255, 255, 0.12)"
      stroke="#00ffff"
      stroke-width="6"
    />
    <!-- keyhole -->
    <circle cx="64" cy="80" r="9" fill="#ff00ff" />
    <rect x="60" y="84" width="8" height="16" rx="4" fill="#ff00ff" />
  </g>
</svg>
